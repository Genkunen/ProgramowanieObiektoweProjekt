name: Build Executables and Run Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 22
          platform: x64

      - name: Install libc++
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main"
          sudo apt-get update
          sudo apt-get install -y libc++-22-dev libc++abi-22-dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build \
            mesa-vulkan-drivers \
            xvfb \
            libglm-dev libvulkan-dev

      - name: Sanity Check
        run: |
          echo '#include <print>' > test.cpp
          echo 'int main() { std::println("Glory to Mankind"); return 0; }' >> test.cpp
          clang++ -std=c++23 -o test test.cpp
          ./test

      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Install Vulkan Headers
        run: |
          git clone --depth=1 https://github.com/KhronosGroup/Vulkan-Headers.git
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build Vulkan-Headers/build --target install

      - name: Install Slang
        run: |
          curl -L https://github.com/shader-slang/slang/releases/download/v2026.10.2/slang-2026.10.2-linux-x86_64.tar.gz \
            | sudo tar -xz -C /usr/local --strip-components=1

      - name: Cache build
        uses: actions/cache@v5
        with:
          path: build
          key: build-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            build-${{ runner.os }}-

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D ENABLE_TESTS=ON \
            -D CMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}" \
            -D CMAKE_CXX_COMPILER=clang++ -D CMAKE_C_COMPILER=clang -D CMAKE_CXX_FLAGS="-stdlib=libc++"

      - name: Build
        run: |
          cmake --build build

      - name: Test
        run: |
          ICD=$(find /usr/share/vulkan/icd.d/ -name "lvp_icd*.json" | head -1)
          echo "Using ICD: $ICD"
          VK_ICD_FILENAMES="$ICD" xvfb-run --auto-servernum bash -c "ctest --test-dir build --verbose --output-junit $PWD/test-results.xml"
        env:
          CTEST_OUTPUT_ON_FAILURE: 1

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: CTest results
          path: test-results.xml
          reporter: java-junit