name: Build Documentation
on: [push, pull_request]

permissions:
  contents: read
  pages: write 
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake doxygen graphviz libglm-dev libvulkan-dev ninja-build

      - name: Install Vulkan Headers
        run: |
          git clone --depth=1 https://github.com/KhronosGroup/Vulkan-Headers.git
          cmake -S Vulkan-Headers -B Vulkan-Headers/build -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build Vulkan-Headers/build --target install
      
      - uses: libsdl-org/setup-sdl@main
        id: sdl
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHADERS=OFF \
            -D CMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build
        run: |
          cmake --build build --target docs

      - name: Add .nojekyll
        run: touch build/html/.nojekyll

      - name: Setup Pages 
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build/html'

      - name: Deploy to Github Pages 
        uses: actions/deploy-pages@v4
